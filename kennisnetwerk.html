// Decrypt function
function decryptName(encId, hexKey) {
  var hex = decryptTable[encId];
  if (!hex) return null;
  try {
    var kb = [];
    for (var i = 0; i < hexKey.length; i += 2) kb.push(parseInt(hexKey.substr(i,2),16));
    var d = [];
    for (var i = 0; i < hex.length; i += 2) d.push(parseInt(hex.substr(i,2),16));
    var r = '';
    for (var i = 0; i < d.length; i++) r += String.fromCharCode(d[i] ^ kb[i % kb.length]);
    return r;
  } catch(e) { return null; }
}

var decryptedNames = {};
var decrypted = false;

function applyDecrypt(hexKey) {
  decryptedNames = {};
  var ok = 0, fail = 0;
  for (var eid in decryptTable) {
    var n = decryptName(eid, hexKey);
    if (n) { decryptedNames[eid] = n; ok++; }
    else fail++;
  }
  decrypted = ok > 0;
  var s = document.getElementById('keystatus');
  if (decrypted) { s.style.color = '#39FF14'; s.textContent = ok + ' namen ontsleuteld'; }
  else if (hexKey.length >= 8) { s.style.color = '#FF007F'; s.textContent = 'Ongeldige sleutel'; }
  else { s.style.color = 'rgba(255,255,255,0.2)'; s.textContent = ''; }
  return decrypted;
}

document.getElementById('keyinput').addEventListener('input', function() {
  applyDecrypt(this.value.trim());
});

var linkLookup = {};
graphData.links.forEach(function(l){
  var s=typeof l.source==='object'?l.source.id:l.source;
  var t=typeof l.target==='object'?l.target.id:l.target;
  linkLookup[s+'|'+t]=l;linkLookup[t+'|'+s]=l;
});

var nodeColorMap = {};
graphData.nodes.forEach(function(n){nodeColorMap[n.id]=n.color});

var maxV=1035, minV=2, maxE=400;

function _rgb(hex){
  var h=String(hex).replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function _mix(a,b,t){
  var A=_rgb(a),B=_rgb(b);
  return [Math.round(A[0]+(B[0]-A[0])*t),Math.round(A[1]+(B[1]-A[1])*t),Math.round(A[2]+(B[2]-A[2])*t)];
}
function _rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function _endpoints(l){
  return [typeof l.source==='object'?l.source.id:l.source,
          typeof l.target==='object'?l.target.id:l.target];
}

var elem = document.getElementById('c');
var tt = document.getElementById('tt');
document.addEventListener('mousemove',function(e){tt.style.left=(e.clientX+18)+'px';tt.style.top=(e.clientY+18)+'px'});

var Graph = ForceGraph3D()(elem)
  .graphData(graphData)
  .nodeLabel(function(n){
    var name = (decrypted && decryptedNames[n.id]) ? decryptedNames[n.id] + '\n' : '';
    return name + (functieMap[n.id] || 'Medewerker') + '\n(' + n.group + ', ' + n.val + 'x)';
  })
  .nodeColor(function(n){return n.color})
  .nodeVal(function(n){return 1+10*Math.sqrt((n.val-minV)/(maxV-minV+1))})
  .nodeRelSize(4.2)
  .nodeResolution(12)
  .nodeOpacity(0.94)
  /* verbindingen: gebogen, met kleurverloop tussen de twee uiteinden */
  .linkCurvature(function(l){
    var e=_endpoints(l), a=e[0]>e[1]?e[0]:e[1], b=e[0]>e[1]?e[1]:e[0];
    var seed=0; for(var i=0;i<8;i++) seed=(seed*31+a.charCodeAt(i)+b.charCodeAt(i))%1000;
    return 0.06+0.18*((seed%100)/100);
  })
  .linkResolution(8)
  .linkWidth(function(l){return 0.75+4.2*Math.pow(l.value/maxE,0.45)})
  .linkOpacity(1)
  .linkColor(function(l){
    var e=_endpoints(l), cs=nodeColorMap[e[0]]||'#8899aa', ct=nodeColorMap[e[1]]||'#8899aa';
    var w=Math.min(1,l.value/70);
    var base = (cs===ct) ? _rgb(cs) : _mix(cs,ct,0.5);
    base = _mix('#'+base.map(function(v){var s=v.toString(16);return s.length<2?'0'+s:s}).join(''), '#f7f0da', 0.10+0.22*w);
    return _rgba(base, 0.38+0.42*w);
  })
  /* deeltjes stromen alleen over de zwaarste relaties */
  .linkDirectionalParticles(function(l){ return l.value>=12 ? Math.min(4, Math.round(l.value/50)+1) : 0; })
  .linkDirectionalParticleWidth(function(l){ return 2+3.5*Math.pow(l.value/maxE,0.5); })
  .linkDirectionalParticleSpeed(function(l){ return 0.0025+0.006*Math.min(1,l.value/maxE); })
  .linkDirectionalParticleColor(function(l){
    var e=_endpoints(l);
    return nodeColorMap[e[1]]||'#ffffff';
  })
  .onLinkClick(function(l){
    var s=typeof l.source==='object'?l.source.id:l.source;
    var t=typeof l.target==='object'?l.target.id:l.target;
    var f=linkLookup[s+'|'+t];
    if(f&&f.urls&&f.urls.length>0)window.open(f.urls[0],'_blank');
  })
  .onNodeClick(function(n){
    var dist=80+n.val*0.3;
    var norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z);
    if(norm>0)Graph.cameraPosition({x:n.x/norm*dist,y:n.y/norm*dist,z:n.z/norm*dist},n,1200);
  })
  .onNodeHover(function(n){
    if(n){
      var name = (decrypted && decryptedNames[n.id]) ? '<b>' + decryptedNames[n.id] + '</b><br>' : '';
      tt.style.display='block'; tt.innerHTML = name + 'Functie: ' + (functieMap[n.id]||'') + '<br>Domein: ' + n.group + '<br>' + n.val + 'x genoemd';
    } else tt.style.display='none';
  })
  .onLinkHover(function(l){
    if(l){
      var s=typeof l.source==='object'?l.source.id:l.source;
      var t=typeof l.target==='object'?l.target.id:l.target;
      var sName = (decrypted && decryptedNames[s]) ? decryptedNames[s] : (functieMap[s]||s.substr(0,8));
      var tName = (decrypted && decryptedNames[t]) ? decryptedNames[t] : (functieMap[t]||t.substr(0,8));
      var h = '<b>' + sName + ' \u2194 ' + tName + '</b><br>' + l.value + 'x samengewerkt';
      var f=linkLookup[s+'|'+t];
      if(f&&f.urls&&f.urls.length>0)h+='<br><a href="'+f.urls[0]+'" target="_blank">\U0001f4c4 Open PDF</a>';
      tt.style.display='block';tt.innerHTML=h;
    }else tt.style.display='none';
  })
  .d3AlphaDecay(0.022)
  .d3VelocityDecay(0.35)
  .warmupTicks(220)
  .cooldownTicks(500)
  .showNavInfo(false)
  .backgroundColor('#1d1806');

/* rustige drift + iets meer lucht tussen de dichtste clusters */
Graph.d3Force('charge').strength(-115).distanceMax(340);
Graph.d3Force('link').distance(function(l){ return 24+5.5*Math.log(1+l.value); });
Graph.d3Force('center').strength(0.75);
Graph.controls().autoRotate = true;
Graph.controls().autoRotateSpeed = 0.26;
Graph.controls().autoRotateDelay = 2500;
Graph.cameraPosition({x:0,y:0,z:900});
setTimeout(function(){
  Graph.zoomToFit(1200, 10);
  setTimeout(function(){
    var z=Graph.cameraPosition().z;
    Graph.cameraPosition({x:0,y:0,z:z*0.62}, {x:0,y:0,z:0}, 900);
  }, 1300);
}, 5200);

window.Graph = Graph;
console.log('Kennisnetwerk versleuteld');
</script>
